  used_for: "benign_edgy_prompts"
  verified_on: "2026-11-05"
  notes: >-
    450 English prompts (250 safe, 200 unsafe contrasts) in xstest_prompts.csv. Card
    front matter license: cc-by-4.0. The GitHub readme (paul-rottger/xstest) says "XSTest
    prompts are subject to Creative Commons Attribution 4.0 International (CC-BY-4.0)
