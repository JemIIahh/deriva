# Public-data source manifest for the multilingual safety drift study.
#
# Every license string below was read on 2026-11-05 from the dataset's own card (the
# Hugging Face README front matter / card text) or, where the data lives on GitHub, from
# the repo's LICENSE file and README. Nothing here was written from memory.
#
# Keys: name, url, license, languages, used_for, verified_on, optional notes, optional
# redistribute.
#   languages   codes from en / hi / hinglish / ar / sw that the source actually covers.
#               Other languages appear only in notes. May be empty only for `excluded`.
#   used_for    harmful_prompts | benign_edgy_prompts | task_qa | task_cross_check
#               | fine_tune_data | excluded
#   verified_on quoted YYYY-MM-DD (unquoted, YAML would turn it into a date object).
#   redistribute  boolean, default true. `false` means evaluation only: the model is scored
#               on the source and only the scores are published; its items are NOT copied
#               into our released datasets (this is how a share-alike source such as
#               Belebele is used without triggering share-alike).
#
# License rule, enforced by validate_entry in src/msd/sources.py (and by tests): a source
# whose license is non-commercial, conflicting, missing, "other" or unknown, or whose card
# could not be read, is `excluded` with the reason in notes. A share-alike source may be
# used only with `redistribute: false`; otherwise it is `excluded` (XQuAD and MLQA are).
# Every other usable entry needs a recognised permissive license. Facts only; no legal
# conclusions. The released test set and fine-tune data go public on Hugging Face; Tiny
# Aya's own terms (CC-BY-NC + Cohere AUP) apply to the model, not to these datasets.
#
# Gap: no public Hinglish (code-mixed Hindi-English) safety set was found, so `hinglish`
# appears only on one excluded speech corpus. Hinglish prompts have to be produced by
# translation (src/msd/translate.py).

# ---------------------------------------------------------------- harmful prompts

- name: "DAMO-NLP-SG/MultiJail"
  url: "https://huggingface.co/datasets/DAMO-NLP-SG/MultiJail"
  license: "mit"
  languages: [en, ar, sw]
  used_for: "harmful_prompts"
  verified_on: "2026-11-05"
  notes: >-
    Official release (single file MultiJail.csv). Card: 315 English unsafe prompts
    annotated into nine languages (zh it vi ar ko th bn sw jv). Only en, ar and sw are
    ours; there is no Hindi and no Hinglish. Card front matter says license: mit; the
    Ethics Statement adds that the research is "solely for academic purposes and ethical
    use" (recorded as a fact, not a license term). The article should cite both the MIT
    license and that ethics statement. The code repo
    DAMO-NLP-SG/multilingual-safety-for-LLMs has a LICENSE file headed "MIT License". Two
    mirrors are listed separately and excluded.

- name: "centerforaisafety/HarmBench"
  url: "https://github.com/centerforaisafety/HarmBench"
  license: "MIT License"
  languages: [en]
  used_for: "harmful_prompts"
  verified_on: "2026-11-05"
  notes: >-
    License read from the repo LICENSE file ("MIT License / Copyright (c) 2024
    centerforaisafety"); the README states no license text and no extra data terms, so
    the license comes from the LICENSE file alone. The Hugging Face mirror walledai/HarmBench is gated (login and accepted
    conditions needed; its card text shows License: mit), so use the public GitHub file
    data/behavior_datasets/harmbench_behaviors_text_all.csv: 400 rows (standard 200,
    contextual 100, copyright 100). English only; needs translation. Contextual rows have
    a ContextString; copyright rows ask for copyrighted text.

- name: "llm-attacks/llm-attacks (AdvBench)"
  url: "https://github.com/llm-attacks/llm-attacks"
  license: "MIT License"
  languages: [en]
  used_for: "harmful_prompts"
  verified_on: "2026-11-05"
  notes: >-
    AdvBench lives in data/advbench/harmful_behaviors.csv (520 rows in the repo; the
    walledai/AdvBench card describes 500). License read from the repo LICENSE file ("MIT
    License / Copyright (c) 2023 Andy Zou") and the README ("llm-attacks is licensed
    under the terms of the MIT license"). The Hugging Face mirror walledai/AdvBench is
    gated (card text shows License: mit and credits the llm-attacks repo). English only;
    needs translation.

- name: "CohereLabs/aya_redteaming"
  url: "https://huggingface.co/datasets/CohereLabs/aya_redteaming"
  license: "apache-2.0"
  languages: [en, hi, ar]
  used_for: "harmful_prompts"
  verified_on: "2026-11-05"
  notes: >-
    Human-written red-teaming prompts in Arabic, English, Filipino, French, Hindi,
    Russian, Serbian and Spanish (card); no Swahili and no Hinglish. Card: "This dataset
    can be used for any purpose, whether academic or commercial, under the terms of the
    Apache 2.0 License." The card lists nine harm categories: Bullying & Harassment;
    Discrimination & Injustice; Graphic Material; Harms of Representation Allocation &
    Quality of Service; Hate Speech; Non-consensual sexual content; Profanity; Self-harm;
    Violence, threats & incitement. Each prompt has a global/local harm label. Card tag
    not-for-all-audiences. The card does not say whether the Hindi text is Devanagari or
    romanized.

- name: "nvidia/Nemotron-Safety-Guard-Dataset-v3"
  url: "https://huggingface.co/datasets/nvidia/Nemotron-Safety-Guard-Dataset-v3"
  license: "cc-by-4.0"
  languages: [en, hi, ar]
  used_for: "harmful_prompts"
  verified_on: "2026-11-05"
  notes: >-
    Card: "License/Terms of Use: CC-BY 4.0" and "ready for commercial/non-commercial
    use". 514,617 samples in 12 languages (ours: en, ar, hi; no sw, no Hinglish).
    Synthetic: culturally adapted and translated from the English Aegis 2.0 dataset plus
    synthetic jailbreak prompt/response pairs, built to train guard models. Aegis 2.0
    prompts come from Anthropic HH-RLHF, Do-Anything-Now and AART per its card; some rows
    from the Kaggle Suicide Detection dataset are REDACTED in the prompt field. Attribution
    required.

# ---------------------------------------------------------- benign-but-edgy prompts

