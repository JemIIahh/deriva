    mirror is gated and was not used. walledai/HiXSTest (Hindi) is listed separately.

- name: "bench-llm/or-bench"
  url: "https://huggingface.co/datasets/bench-llm/or-bench"
  license: "cc-by-4.0"
  languages: [en]
  used_for: "benign_edgy_prompts"
  verified_on: "2026-11-05"
  notes: >-
    Over-refusal benchmark, English only; card front matter license: cc-by-4.0 and no
    other license text. Per the card plots, OR-Bench-Hard-1K holds the seemingly toxic but
    safe prompts (refusing them counts as over-refusal) and OR-Bench-Toxic holds
    genuinely toxic prompts, so the two must not be mixed; the card text does not
    describe the or-bench-80k config beyond its name. Attribution required. Needs
    translation for hi/ar/sw/Hinglish.

# -------------------------------------------------- capability / task cross-checks

- name: "facebook/belebele"
  url: "https://huggingface.co/datasets/facebook/belebele"
  license: "cc-by-sa-4.0"
  languages: [en, hi, ar, sw]
  used_for: "task_cross_check"
  verified_on: "2026-11-05"
  redistribute: false
  notes: >-
    Multiple-choice reading comprehension, test split only. Config names: eng_Latn,
    hin_Deva, hin_Latn (card table: "Hindi (Romanized)"), arb_Arab, swh_Latn. hin_Latn is
    romanized Hindi, not code-mixed Hinglish, so hinglish is not listed. SHARE-ALIKE: the
    GitHub README (facebookresearch/belebele) says the dataset is licensed under
    LICENSE_CC-BY-SA4.0, and that the separate training set is mostly CC-BY-NC (not
    used). EVALUATION ONLY (redistribute: false): the model is scored on Belebele and
    only the scores are published; Belebele items, passages and translations are NOT
    copied into our released datasets, so share-alike is not triggered. GitHub repo
    license metadata reads NOASSERTION.

- name: "CohereLabs/Global-MMLU"
  url: "https://huggingface.co/datasets/CohereLabs/Global-MMLU"
  license: "apache-2.0"
  languages: [en, hi, ar, sw]
  used_for: "task_cross_check"
  verified_on: "2026-11-05"
  notes: >-
    Card: "This dataset can be used for any purpose, under the terms of the Apache 2.0
    License." 42 languages including en, hi, ar and sw (card language table). MMLU
    questions combining machine translation with professional and crowd-sourced
    post-edits; general knowledge multiple choice, not public-services QA. Permissive
