[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msd"
version = "0.1.0"
description = "Multilingual safety drift: does safety fine-tuning in English hold in other languages?"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib>=3.10",
    "safetensors",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
judge = ["anthropic"]  # the anthropic: judge; the hf: judge needs torch and transformers, which only the GPU runtime has

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a paid external API (needs ANTHROPIC_API_KEY); only runs when asked for with `pytest -m live`",
]
